<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesse Sua Conta</title>
  
  <!-- Fontes e Ícones -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />
  
  <!-- Link para o arquivo CSS externo -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="login-card" id="login-card">
    <h1 class="login-title">Controle de Patrimônio</h1>

    <div class="field-group">
      <label class="field-label" for="user-input">Usuário</label>
      <div class="field-wrap">
        <input
          id="user-input"
          class="field-input"
          type="text"
          placeholder="digite seu usuário"
          autocomplete="username"
        />
      </div>
      <span class="error-msg" id="user-error">Informe seu usuário</span>
    </div>

    <div class="field-group">
      <label class="field-label" for="pass-input">Senha</label>
      <div class="field-wrap">
        <input
          id="pass-input"
          class="field-input has-toggle"
          type="password"
          placeholder="digite sua senha"
          autocomplete="current-password"
        />
        <button class="toggle-btn" id="toggle-pass" type="button" aria-label="Mostrar ou ocultar senha">
          <i class="ti ti-eye" aria-hidden="true"></i>
        </button>
      </div>
      <span class="error-msg" id="pass-error">Informe sua senha.</span>
    </div>

    <button class="btn-entrar" id="btn-entrar" type="button">Entrar</button>


    
  </div>

  <!-- Link para o arquivo JavaScript externo -->
  <script src="script.js"></script>

</body>
</html>
