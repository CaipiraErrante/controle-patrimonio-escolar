services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend:v1.0.0
    container_name: frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend    
    ports:
      - "80:80"

  db:
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql/data/18/docker
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: backend:v1.0.0
    container_name: backend
    # working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG}
    depends_on:
      - db
    command: >
      sh -lc "chmod +x /app/scripts/commands.sh && /app/scripts/commands.sh"

volumes:
  postgres_data:
    driver: local