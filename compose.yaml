services:
  mysql:
    image: mysql:8.0
    container_name: controle-patrimonio-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    image: controle-patrimonio-frontend:latest
    container_name: controle-patrimonio-frontend
    restart: unless-stopped
    ports:
      - "80:80"

  api:
    build:
      context: ./ControlePatrimonio.Api
      dockerfile: Dockerfile
    image: controle-patrimonio-api:latest
    container_name: controle-patrimonio-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=${MYSQL_PORT:-3306};Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};"
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"

volumes:
  mysql_data:
    driver: local