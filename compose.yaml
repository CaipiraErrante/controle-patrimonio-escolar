services:
  frontend:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    image: frontend:v2.0.0
    container_name: frontend
    restart: unless-stopped
    volumes:
      - ./frontend-angular:/app
      - /app/node_modules
    depends_on:
      - backend    
    ports:
      - "80:4200"

  db:
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql/data/18/docker
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: backend:v1.0.0
    container_name: backend
    # working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG}
    depends_on:
      - db

    command: ["sh", "/app/scripts/commands.sh"]


volumes:
  postgres_data:
    driver: local