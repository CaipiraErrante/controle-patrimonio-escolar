<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventário Atual</title>
  
  <!-- Fontes e Ícones -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />
  
  <!-- Link para o arquivo CSS externo -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="login-card inventory-card" id="inventory-card">
    <h1 class="login-title" style="text-align: left; margin-bottom: 1.5rem;">Inventário Atual</h1>

    <div class="table-container">
      <table class="inventory-table">
        <thead>
          <tr>
            <th>Patrimônio</th>
            <th>Descrição</th>
            <th>Localização</th>
            <th>Estado</th>
            <th>Responsável</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>PAT-0001</td>
            <td>Notebook Dell Inspiron</td>
            <td>Sala de Informática</td>
            <td>Bom</td>
            <td>Coordenação</td>
          </tr>
          <tr>
            <td>PAT-0002</td>
            <td>Projetor Epson</td>
            <td>Sala 5</td>
            <td>Regular</td>
            <td>Professor Marcos</td>
          </tr>
          <tr>
            <td>PAT-0003</td>
            <td>Mesa de escritório</td>
            <td>Secretaria</td>
            <td>Bom</td>
            <td>Ana Paula</td>
          </tr>
        </tbody>
      </table>
    </div>

    

    <div class="bottom-links">
      <a href="cadastro.html"><button class="btn-atualizar" id="btn-atualizar" type="button">Cadastro</button></a>
      <a href="login.html"><button class="btn-deslogar" id="btn-atualizar" type="button">Logoff</button></a>
    </div>
  </div>

  <!-- Link para o arquivo JavaScript externo (se houver lógica futuramente) -->
  <script src="script.js"></script>

</body>
</html>
